<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const boxSize = 20;
        let score = 0;

        let snake = [];
        snake[0] = { x: 9 * boxSize, y: 10 * boxSize };

        let food = {
            x: Math.floor(Math.random() * 19 + 1) * boxSize,
            y: Math.floor(Math.random() * 19 + 1) * boxSize
        };

        document.addEventListener('keydown', direction);

        let dx = boxSize;
        let dy = 0;

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            createSnake();
            createFood();
            checkCollision();
        }

        function createSnake() {
            for (let i = 0; i < snake.length; i++) {
                if (i == 0) {
                    ctx.fillStyle = "green";
                } else {
                    ctx.fillStyle = "lime";
                }
                ctx.fillRect(snake[i].x, snake[i].y, boxSize, boxSize);
                ctx.strokeStyle = "darkgreen";
                ctx.strokeRect(snake[i].x, snake[i].y, boxSize, boxSize);
            }
        }

        function createFood() {
            ctx.fillStyle = 'red';
            ctx.fillRect(food.x, food.y, boxSize, boxSize);
        }

        function direction(event) {
            if (event.keyCode == 37 && dx != boxSize) {
                dx = -boxSize;
                dy = 0;
            } else if (event.keyCode == 38 && dy != boxSize) {
                dx = 0;
                dy = -boxSize;
            } else if (event.keyCode == 39 && dx != -boxSize) {
                dx = boxSize;
                dy = 0;
            } else if (event.keyCode == 40 && dy != -boxSize) {
                dx = 0;
                dy = boxSize;
            }
        }

        function checkCollision() {
            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x == snake[0].x && snake[i].y == snake[0].y) {
                    clearInterval(game);
                }
            }

            if (snake[0].x >= canvas.width || snake[0].x < 0 || snake[0].y >= canvas.height || snake[0].y < 0) {
                clearInterval(game);
            }

            if (snake[0].x == food.x && snake[0].y == food.y) {
                score++;
                food = {
                    x: Math.floor(Math.random() * 19 + 1) * boxSize,
                    y: Math.floor(Math.random() * 19 + 1) * boxSize
                }
            }

            let newHead = { x: snake[0].x + dx, y: snake[0].y + dy };

            snake.unshift(newHead);

            if (snake[0].x != food.x || snake[0].y != food.y) {
                snake.pop();
            }
        }

        let game = setInterval(drawGame, 100);
    </script>
</body>
</html>
