<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Процентный счётчик</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .stop-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
        }

        .share-btn {
            background: linear-gradient(135deg, #20c997 0%, #1a9f7a 100%);
        }

        .result {
            margin-top: 30px;
            text-align: center;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            border: 2px dashed #ddd;
        }

        .percentage {
            font-size: 4em;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
        }

        .info {
            color: #888;
            font-size: 0.9em;
            margin-top: 10px;
            line-height: 1.5;
        }

        .config-mode {
            display: block;
        }

        .counter-mode {
            display: none;
        }

        .image-preview {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
            margin: 10px auto;
            display: block;
            border: 2px solid #ddd;
        }

        .image-preview-small {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 15px;
            border: 2px solid #ddd;
        }

        .counter-header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .counter-title {
            margin: 0;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #20c997;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(0);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .button-group button {
            margin-top: 0;
            flex: 1;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .file-input-button {
            background: #6c757d;
            color: white;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
        }
    </style>
</head>
<body>
<!-- Уведомление -->
<div class="notification" id="notification">
    Ссылка скопирована в буфер обмена!
</div>

<div class="container">
    <!-- Режим настройки -->
    <div class="config-mode" id="configMode">
        <h1>⚙️ Настройки</h1>

        <div class="input-group">
            <label for="counterName">Название:</label>
            <input type="text" id="counterName" placeholder="Мой инвестиционный счёт" value="Мой инвестиционный счёт">
        </div>

        <div class="input-group">
            <label for="imageUpload">Картинка:</label>
            <div class="file-input-wrapper">
                <div class="file-input-button">Выбрать картинку</div>
                <input type="file" id="imageUpload" accept="image/*">
            </div>
            <img id="imagePreview" class="image-preview" style="display: none;">
        </div>

        <div class="input-group">
            <label for="startDate">Дата начала:</label>
            <input type="datetime-local" id="startDate">
        </div>

        <div class="input-group">
            <label for="initialAmount">Начальная сумма:</label>
            <input type="number" id="initialAmount" value="1000" step="100">
        </div>

        <div class="input-group">
            <label for="interestRate">Ставка (%):</label>
            <input type="number" id="interestRate" value="10" step="0.1">
        </div>

        <button onclick="startAndShare()" class="share-btn">Запустить счётчик</button>
    </div>

    <!-- Режим счётчика -->
    <div class="counter-mode" id="counterMode">
        <div class="counter-header">
            <img id="counterImage" class="image-preview-small" style="display: none;">
            <h1 class="counter-title" id="counterTitle">💰 Счётчик</h1>
        </div>

        <div class="result">
            <div class="percentage" id="percentageDisplay">0.00</div>
            <div class="info" id="info"></div>
        </div>

        <div class="button-group">
            <button onclick="stopCounter()" class="stop-btn">Настройки</button>
            <button onclick="shareCounter()" class="share-btn">Поделиться</button>
        </div>
    </div>
</div>

<script>
    let counterInterval = null;
    let startTime = null;
    let initialAmount = 0;
    let annualRate = 0;
    let counterName = "";
    let imageData = null;

    // Элементы DOM
    const configMode = document.getElementById('configMode');
    const counterMode = document.getElementById('counterMode');
    const counterTitle = document.getElementById('counterTitle');
    const notification = document.getElementById('notification');
    const imageUpload = document.getElementById('imageUpload');
    const imagePreview = document.getElementById('imagePreview');
    const counterImage = document.getElementById('counterImage');

    // Инициализация из URL параметров
    function initFromURL() {
        const urlParams = new URLSearchParams(window.location.search);

        // Название
        const urlName = urlParams.get('name');
        if (urlName) {
            document.getElementById('counterName').value = decodeURIComponent(urlName);
        }

        // Картинка (base64)
        const urlImage = urlParams.get('image');
        if (urlImage) {
            imageData = urlImage;
            imagePreview.src = urlImage;
            imagePreview.style.display = 'block';
            counterImage.src = urlImage;
            counterImage.style.display = 'block';
        }

        // Дата начала
        const urlStartDate = urlParams.get('startDate');
        if (urlStartDate) {
            document.getElementById('startDate').value = urlStartDate;
        } else {
            // Устанавливаем текущую дату и время по умолчанию
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('startDate').value = now.toISOString().slice(0, 16);
        }

        // Начальная сумма
        const urlAmount = urlParams.get('amount');
        if (urlAmount) {
            document.getElementById('initialAmount').value = urlAmount;
        }

        // Процентная ставка
        const urlRate = urlParams.get('rate');
        if (urlRate) {
            document.getElementById('interestRate').value = urlRate;
        }

        // Автозапуск из URL
        const urlAutoStart = urlParams.get('autoStart');
        if (urlAutoStart === 'true') {
            setTimeout(() => startCounter(), 100);
        }
    }

    // Обработчик загрузки картинки
    imageUpload.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                imageData = e.target.result;
                imagePreview.src = imageData;
                imagePreview.style.display = 'block';
                counterImage.src = imageData;
                counterImage.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    });

    function startCounter() {
        // Получаем значения из полей ввода
        const startDateValue = document.getElementById('startDate').value;
        counterName = document.getElementById('counterName').value;
        initialAmount = parseFloat(document.getElementById('initialAmount').value);
        annualRate = parseFloat(document.getElementById('interestRate').value);

        if (isNaN(initialAmount) || isNaN(annualRate) || !startDateValue || !counterName) {
            showNotification('Пожалуйста, заполните все поля корректно', 'error');
            return;
        }

        startTime = new Date(startDateValue);

        // Устанавливаем название и картинку
        counterTitle.textContent = counterName;
        if (imageData) {
            counterImage.src = imageData;
            counterImage.style.display = 'block';
        }

        // Переключаемся в режим счётчика
        configMode.style.display = 'none';
        counterMode.style.display = 'block';

        // Обновляем отображение
        updateDisplay(initialAmount);

        // Запускаем обновление каждую секунду
        if (counterInterval) {
            clearInterval(counterInterval);
        }
        counterInterval = setInterval(updateCounter, 1000);
    }

    function startAndShare() {
        startCounter();
        if (counterMode.style.display === 'block') {
            generateShareLink();
            copyToClipboard(generateShareLink());
            showNotification('Счётчик запущен и ссылка скопирована!');
        }
    }

    function stopCounter() {
        if (counterInterval) {
            clearInterval(counterInterval);
            counterInterval = null;
        }

        // Возвращаемся в режим настройки
        configMode.style.display = 'block';
        counterMode.style.display = 'none';
    }

    function updateCounter() {
        const now = new Date();
        const elapsedSeconds = (now - startTime) / 1000;

        if (elapsedSeconds < 0) {
            // Если дата начала в будущем
            document.getElementById('info').textContent = 'Ожидание начала...';
            updateDisplay(initialAmount);
            return;
        }

        // Рассчитываем сумму с учётом сложных процентов
        const elapsedYears = elapsedSeconds / (365 * 24 * 60 * 60);
        const currentAmount = initialAmount * Math.pow(1 + annualRate/100, elapsedYears);

        updateDisplay(currentAmount);

        // Обновляем информацию о времени
        const elapsedDays = Math.floor(elapsedSeconds / (24 * 60 * 60));
        const elapsedHours = Math.floor((elapsedSeconds % (24 * 60 * 60)) / (60 * 60));
        const elapsedMinutes = Math.floor((elapsedSeconds % (60 * 60)) / 60);
        const elapsedSecs = Math.floor(elapsedSeconds % 60);

        const startDate = new Date(startTime);
        const formattedDate = startDate.toLocaleDateString('ru-RU');

        document.getElementById('info').innerHTML =
            `Прошло: ${elapsedDays}д ${elapsedHours}ч ${elapsedMinutes}м ${elapsedSecs}с<br>` +
            `(${initialAmount.toFixed(2)} с ${formattedDate} под ${annualRate}%)`;
    }

    function updateDisplay(amount) {
        const percentageElement = document.getElementById('percentageDisplay');

        // Форматируем число с двумя знаками после запятой
        const formattedAmount = amount.toFixed(2);

        // Плавное изменение числа
        percentageElement.textContent = formattedAmount;
    }

    function generateShareLink() {
        const baseUrl = window.location.origin + window.location.pathname;
        const params = new URLSearchParams({
            name: encodeURIComponent(counterName),
            startDate: document.getElementById('startDate').value,
            amount: initialAmount,
            rate: annualRate,
            autoStart: 'true'
        });

        // Добавляем картинку если есть
        if (imageData) {
            params.set('image', imageData);
        }

        const shareUrl = `${baseUrl}?${params.toString()}`;
        return shareUrl;
    }

    function shareCounter() {
        const shareUrl = generateShareLink();
        copyToClipboard(shareUrl);
        showNotification('Ссылка скопирована в буфер обмена!');
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text)
            .then(() => {})
            .catch(() => {
                // Fallback для старых браузеров
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
            });
    }

    function showNotification(message, type = 'success') {
        notification.textContent = message;
        notification.className = 'notification';

        if (type === 'error') {
            notification.style.background = '#ff6b6b';
        } else {
            notification.style.background = '#20c997';
        }

        notification.classList.add('show');

        setTimeout(() => {
            notification.classList.remove('show');
        }, 3000);
    }

    // Инициализация при загрузке
    window.onload = initFromURL;
</script>
</body>
</html>
