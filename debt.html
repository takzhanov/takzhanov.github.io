<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Процентный счётчик</title>
    <style>
        :root {
            --bg-gradient-start: #667eea;
            --bg-gradient-end: #764ba2;
            --primary: #667eea;
            --primary-dark: #4a5bd4;
            --secondary: #eef2ff;
            --danger: #e53e3e;
            --success: #38a169;
            --text-main: #1f2933;
            --text-muted: #6b7280;
            --card-bg: #ffffff;
            --border-radius-lg: 24px;
            --shadow-lg: 0 18px 40px rgba(15, 23, 42, 0.25);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            color: var(--text-main);
        }

        .app {
            width: 100%;
            max-width: 960px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-lg);
            padding: clamp(1.5rem, 3vw, 2.5rem);
            max-width: 640px;
            margin: 0 auto;
        }

        .card-header {
            text-align: center;
            margin-bottom: 1.25rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #e5e7eb;
        }

        .card-header h1 {
            margin: 0;
            font-size: clamp(1.4rem, 3vw, 1.8rem);
            font-weight: 700;
            color: var(--text-main);
        }

        .card-header p {
            margin: 0.4rem 0 0;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .hidden {
            display: none !important;
        }

        .divider {
            width: 100%;
            height: 1px;
            margin: 0.9rem 0;
            background: linear-gradient(
                    to right,
                    rgba(148, 163, 184, 0.05),
                    rgba(148, 163, 184, 0.8),
                    rgba(148, 163, 184, 0.05)
            );
        }

        /* Формы / настройки */

        .form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .field label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .field label .label-icon {
            font-size: 1rem;
        }

        .field input {
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            padding: 0.55rem 0.75rem;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .field input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 1px rgba(102, 126, 234, 0.45);
        }

        .field input[type="number"]::-webkit-outer-spin-button,
        .field input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .field input[type="number"] {
            -moz-appearance: textfield;
        }

        .row {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .row > .col {
            flex: 1 1 0;
            min-width: 0;
        }

        .image-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: flex-end;
        }

        .image-row .field {
            flex: 1 1 200px;
        }

        .image-buttons {
            display: flex;
            flex-direction: row;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .image-buttons .btn {
            white-space: nowrap;
        }

        .image-preview-wrapper {
            margin-top: 0.5rem;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .image-preview-wrapper.visible {
            display: flex;
        }

        .image-preview-wrapper img {
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
            display: block;
        }

        .actions {
            margin-top: 0.75rem;
            display: flex;
            justify-content: flex-end;
        }

        /* Кнопки */

        .btn {
            border-radius: 999px;
            border: none;
            padding: 0.55rem 1.3rem;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            transition: background-color 0.15s ease, transform 0.08s ease, box-shadow 0.15s ease, border-color 0.15s ease, color 0.15s ease;
            user-select: none;
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 8px 18px rgba(102, 126, 234, 0.35);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--secondary);
            color: var(--primary);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #cbd5f5;
            color: var(--primary);
        }

        .btn-secondary:hover,
        .btn-outline:hover {
            background: rgba(102, 126, 234, 0.06);
        }

        .btn-icon {
            font-size: 1.1rem;
            line-height: 1;
        }

        .btn:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* Режим счётчика */

        .counter {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
            text-align: center;
        }

        .counter-title {
            margin: 0;
            font-size: clamp(1.4rem, 3.1vw, 2rem);
            font-weight: 700;
            color: var(--text-main);
        }

        .counter-image-wrapper {
            margin-top: 0.7rem;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .counter-image-wrapper.visible {
            display: flex;
        }

        .counter-image-wrapper img {
            max-width: 100%;
            max-height: 320px;
            object-fit: contain;
            display: block;
        }

        .counter-block {
            margin-top: 1rem;
            width: 100%;
            padding: 0.9rem 1rem 1rem;
            border-radius: 18px;
            background: linear-gradient(145deg, #f9fafb, #eef2ff);
            border: 1px solid rgba(148, 163, 184, 0.4);
        }

        .counter-main-value {
            font-family: "Courier New", monospace;
            font-weight: 700;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            letter-spacing: 0.03em;
            color: var(--text-main);
            word-break: break-all;
            margin-bottom: 0.5rem;
        }

        .counter-info-line {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: 0.15rem;
        }

        .counter-info-line.secondary {
            font-size: 0.9rem;
        }

        .counter-actions {
            margin-top: 1.1rem;
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Toast-уведомления */

        .toast-container {
            position: fixed;
            top: 16px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 9999;
        }

        .toast {
            min-width: 220px;
            max-width: 320px;
            padding: 0.7rem 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
            color: #ffffff;
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.35);
            opacity: 0;
            transform: translateX(110%);
            transition: opacity 0.18s ease, transform 0.18s ease;
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }

        .toast--success {
            background: var(--success);
        }

        .toast--error {
            background: var(--danger);
        }

        .toast--visible {
            opacity: 1;
            transform: translateX(0);
        }

        .toast-icon {
            font-size: 1rem;
        }

        /* Адаптивность */

        @media (max-width: 768px) {
            .card {
                padding: 1.4rem;
                border-radius: 20px;
            }

            .image-buttons {
                width: 100%;
                justify-content: flex-start;
            }

            .actions {
                justify-content: stretch;
            }

            .actions .btn {
                width: 100%;
                justify-content: center;
            }

            .counter-actions {
                flex-direction: column;
            }

            .counter-actions .btn {
                width: 100%;
            }

            .image-preview-wrapper img,
            .counter-image-wrapper img {
                max-height: 260px;
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 1.2rem;
                border-radius: 18px;
            }

            .card-header p {
                font-size: 0.85rem;
            }

            .counter-main-value {
                font-size: clamp(2.3rem, 8vw, 3.2rem);
            }

            .image-preview-wrapper img,
            .counter-image-wrapper img {
                max-height: 240px;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="card">
        <!-- Режим настройки -->
        <section id="settingsView">
            <header class="card-header">
                <h1>Процентный счётчик</h1>
                <p>Настрой параметры, сгенерируй ссылку и наблюдай рост суммы по сложным процентам.</p>
            </header>

            <form id="settingsForm" class="form" novalidate>
                <div class="form-section">
                    <div class="field">
                        <label for="nameInput">
                            <span class="label-icon">🏷️</span>
                            <span>Название счётчика</span>
                        </label>
                        <input id="nameInput" type="text" placeholder="Например: Мой капитал 2030">
                    </div>

                    <div class="image-row">
                        <div class="field">
                            <label for="imageInput">
                                <span class="label-icon">🖼️</span>
                                <span>Ссылка на картинку (необязательно)</span>
                            </label>
                            <input id="imageInput" type="url" placeholder="https://example.com/image.webp">
                        </div>
                        <div class="image-buttons">
                            <button type="button" id="loadImageBtn" class="btn btn-secondary">
                                <span class="btn-icon">👁️</span><span>Предпросмотр</span>
                            </button>
                            <button type="button" id="clearImageBtn" class="btn btn-outline">
                                🧹 Убрать
                            </button>
                        </div>
                    </div>

                    <div id="imagePreviewWrapper" class="image-preview-wrapper">
                        <img id="imagePreview" alt="Предпросмотр картинки">
                    </div>
                </div>

                <div class="divider"></div>

                <div class="form-section">
                    <div class="row">
                        <div class="col field">
                            <label for="startDateInput">
                                <span class="label-icon">⏰</span>
                                <span>Дата и время начала</span>
                            </label>
                            <input id="startDateInput" type="datetime-local">
                        </div>
                        <div class="col field">
                            <label for="amountInput">
                                <span class="label-icon">💵</span>
                                <span>Начальная сумма</span>
                            </label>
                            <input id="amountInput" type="number" inputmode="decimal" placeholder="1000000" value="1000000">
                        </div>
                    </div>

                    <div class="field">
                        <label for="rateInput">
                            <span class="label-icon">📈</span>
                            <span>Годовая ставка, % (запятая или точка)</span>
                        </label>
                        <input id="rateInput" type="text" placeholder="Например: 10 или 12,5" value="10">
                    </div>
                </div>

                <div class="divider"></div>

                <div class="actions">
                    <button type="button" id="startCounterBtn" class="btn btn-primary">
                        <span class="btn-icon">🚀</span><span>Запустить счётчик</span>
                    </button>
                </div>
            </form>
        </section>

        <!-- Режим счётчика -->
        <section id="counterView" class="counter hidden">
            <h2 id="counterTitle" class="counter-title"></h2>

            <div class="divider"></div>

            <div id="counterImageWrapper" class="counter-image-wrapper">
                <img id="counterImage" alt="">
            </div>

            <div class="counter-block">
                <div class="counter-main-value" id="mainAmount">0</div>
                <div class="counter-info-line" id="elapsedInfo">⏱ Прошло: 0д 0ч 0м 0с</div>
                <div class="counter-info-line secondary" id="detailsInfo">ℹ️</div>
            </div>

            <div class="counter-actions">
                <button type="button" id="backToSettingsBtn" class="btn btn-secondary">
                    ⚙️ Настройки
                </button>
                <button type="button" id="shareBtn" class="btn btn-outline">
                    🔗 Поделиться
                </button>
            </div>
        </section>
    </div>
</div>

<div id="toastContainer" class="toast-container"></div>

<script>
    (function () {
        "use strict";

        const MS_PER_SECOND = 1000;
        const SECONDS_PER_DAY = 86400;
        const SECONDS_PER_HOUR = 3600;
        const SECONDS_PER_MINUTE = 60;
        const SECONDS_PER_YEAR = 365 * 24 * 60 * 60;

        const state = {
            name: "Процентный счётчик",
            imageUrl: "",
            startDateString: "",
            startDate: null,
            initialAmount: 1000000,
            rate: 10
        };

        let timerId = null;

        // DOM-элементы
        const settingsView = document.getElementById("settingsView");
        const counterView = document.getElementById("counterView");

        const nameInput = document.getElementById("nameInput");
        const imageInput = document.getElementById("imageInput");
        const startDateInput = document.getElementById("startDateInput");
        const amountInput = document.getElementById("amountInput");
        const rateInput = document.getElementById("rateInput");

        const imagePreviewWrapper = document.getElementById("imagePreviewWrapper");
        const imagePreview = document.getElementById("imagePreview");

        const loadImageBtn = document.getElementById("loadImageBtn");
        const clearImageBtn = document.getElementById("clearImageBtn");
        const startCounterBtn = document.getElementById("startCounterBtn");

        const counterTitle = document.getElementById("counterTitle");
        const counterImageWrapper = document.getElementById("counterImageWrapper");
        const counterImage = document.getElementById("counterImage");
        const mainAmountEl = document.getElementById("mainAmount");
        const elapsedInfoEl = document.getElementById("elapsedInfo");
        const detailsInfoEl = document.getElementById("detailsInfo");
        const backToSettingsBtn = document.getElementById("backToSettingsBtn");
        const shareBtn = document.getElementById("shareBtn");

        const toastContainer = document.getElementById("toastContainer");

        // ===== Утилиты =====

        function showToast(message, type) {
            const toast = document.createElement("div");
            toast.className = "toast toast--" + (type === "error" ? "error" : "success");

            const iconSpan = document.createElement("span");
            iconSpan.className = "toast-icon";
            iconSpan.textContent = type === "error" ? "⚠️" : "✅";

            const textSpan = document.createElement("span");
            textSpan.textContent = message;

            toast.appendChild(iconSpan);
            toast.appendChild(textSpan);

            toastContainer.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.add("toast--visible");
            });

            setTimeout(() => {
                toast.classList.remove("toast--visible");
                setTimeout(() => {
                    if (toast.parentNode) {
                        toast.parentNode.removeChild(toast);
                    }
                }, 200);
            }, 3000);
        }

        function getNowAsLocalInputString() {
            const now = new Date();
            const pad = (n) => n.toString().padStart(2, "0");

            const year = now.getFullYear();
            const month = pad(now.getMonth() + 1);
            const day = pad(now.getDate());
            const hours = pad(now.getHours());
            const minutes = pad(now.getMinutes());

            return year + "-" + month + "-" + day + "T" + hours + ":" + minutes;
        }

        function parseAmount(value) {
            if (value == null) return NaN;
            const cleaned = String(value).replace(/\s+/g, "").replace(",", ".");
            const num = parseFloat(cleaned);
            return Number.isFinite(num) ? num : NaN;
        }

        function parseRate(value) {
            if (!value) return NaN;
            const cleaned = String(value)
                .replace(",", ".")
                .replace(/[^\d.\-]/g, "");
            const num = parseFloat(cleaned);
            return Number.isFinite(num) ? num : NaN;
        }

        function formatMainNumber(value) {
            // Основное число — без разделителей тысяч, 2 знака после запятой
            if (!Number.isFinite(value)) return "0";
            const fixed = value.toFixed(2);
            if (fixed.endsWith(".00")) {
                return fixed.slice(0, -3);
            }
            return fixed;
        }

        function formatAmountInfo(value) {
            if (!Number.isFinite(value)) return "0";
            const parts = Math.trunc(value).toString().split("");
            const res = [];
            for (let i = 0; i < parts.length; i++) {
                const idxFromEnd = parts.length - i;
                res.push(parts[i]);
                if (idxFromEnd > 1 && idxFromEnd % 3 === 1) {
                    res.push(" ");
                }
            }
            return res.join("").trim();
        }

        function formatDateInfo(date) {
            if (!(date instanceof Date) || isNaN(date.getTime())) return "";
            const pad = (n) => n.toString().padStart(2, "0");
            const dd = pad(date.getDate());
            const mm = pad(date.getMonth() + 1);
            const yyyy = date.getFullYear();
            const hh = pad(date.getHours());
            const min = pad(date.getMinutes());
            return dd + "." + mm + "." + yyyy + " " + hh + ":" + min;
        }

        function isValidImageUrl(urlStr) {
            if (!urlStr) return false;
            try {
                const url = new URL(urlStr);
                if (!/^https?:$/.test(url.protocol)) return false;

                const allowedExt = [".jpg", ".jpeg", ".png", ".gif", ".webp", ".svg"];
                const path = url.pathname.toLowerCase();
                const hasExt = allowedExt.some((ext) => path.endsWith(ext));

                const host = url.hostname.toLowerCase();
                const popularHosts = [
                    "imgur.com",
                    "i.imgur.com",
                    "ibb.co",
                    "i.ibb.co",
                    "postimg.cc",
                    "vk.com",
                    "userapi.com",
                    "sun9"
                ];
                const isPopular = popularHosts.some((h) => host.includes(h));

                return hasExt || isPopular;
            } catch (e) {
                return false;
            }
        }

        function loadPreviewImage(url) {
            if (!url) {
                showToast("Введите ссылку на картинку.", "error");
                return;
            }

            if (!isValidImageUrl(url)) {
                showToast("Некорректный URL картинки.", "error");
                return;
            }

            imagePreview.onload = function () {
                imagePreviewWrapper.classList.add("visible");
            };
            imagePreview.onerror = function () {
                imagePreviewWrapper.classList.remove("visible");
                imagePreview.removeAttribute("src");
                showToast("Не удалось загрузить картинку.", "error");
            };
            imagePreview.src = url;
        }

        function clearPreviewImage() {
            imageInput.value = "";
            imagePreviewWrapper.classList.remove("visible");
            imagePreview.removeAttribute("src");
            state.imageUrl = "";
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text).then(
                    () => true,
                    () => false
                );
            }

            try {
                const textarea = document.createElement("textarea");
                textarea.value = text;
                textarea.style.position = "fixed";
                textarea.style.opacity = "0";
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                const result = document.execCommand("copy");
                document.body.removeChild(textarea);
                return Promise.resolve(result);
            } catch (e) {
                return Promise.resolve(false);
            }
        }

        function buildUrlFromState() {
            const params = new URLSearchParams();
            params.set("name", state.name);
            if (state.imageUrl) {
                params.set("image", state.imageUrl);
            }
            if (state.startDateString) {
                params.set("startDate", state.startDateString);
            }
            params.set("amount", String(state.initialAmount));
            params.set("rate", String(state.rate).replace(".", ","));
            params.set("autoStart", "true");

            return window.location.origin + window.location.pathname + "?" + params.toString();
        }

        function computeElapsed(secondsTotal) {
            const s = Math.max(0, Math.floor(secondsTotal));
            const days = Math.floor(s / SECONDS_PER_DAY);
            let rest = s % SECONDS_PER_DAY;
            const hours = Math.floor(rest / SECONDS_PER_HOUR);
            rest %= SECONDS_PER_HOUR;
            const minutes = Math.floor(rest / SECONDS_PER_MINUTE);
            const seconds = rest % SECONDS_PER_MINUTE;

            return { days, hours, minutes, seconds };
        }

        function updateCounterDisplay() {
            if (!state.startDate || isNaN(state.startDate.getTime())) {
                return;
            }

            const now = new Date();
            const elapsedSeconds = Math.max(
                0,
                Math.floor((now.getTime() - state.startDate.getTime()) / MS_PER_SECOND)
            );

            const elapsedYears = elapsedSeconds / SECONDS_PER_YEAR;
            const annualRate = state.rate;
            const P = state.initialAmount;

            const growthFactor = Math.pow(1 + annualRate / 100, elapsedYears);
            const currentAmount = P * growthFactor;

            mainAmountEl.textContent = formatMainNumber(currentAmount);

            const elapsed = computeElapsed(elapsedSeconds);
            elapsedInfoEl.textContent =
                "⏱ Прошло: " +
                elapsed.days + "д " +
                elapsed.hours + "ч " +
                elapsed.minutes + "м " +
                elapsed.seconds + "с";

            const startDateStr = formatDateInfo(state.startDate);
            const initialStr = formatAmountInfo(state.initialAmount);
            const rateStr = String(state.rate).replace(".", ",");

            detailsInfoEl.textContent =
                "ℹ️ (" + initialStr + " с " + startDateStr + " под " + rateStr + "%)";
        }

        function enterCounterMode() {
            if (timerId !== null) {
                clearInterval(timerId);
                timerId = null;
            }

            const titleText = state.name || "Процентный счётчик";
            counterTitle.textContent = "💰 " + titleText;

            if (state.imageUrl) {
                counterImageWrapper.classList.add("visible");
                counterImage.onload = function () {
                    // картинка успешно показана
                };
                counterImage.onerror = function () {
                    counterImageWrapper.classList.remove("visible");
                    counterImage.removeAttribute("src");
                    showToast("Не удалось загрузить картинку для счётчика.", "error");
                };
                counterImage.src = state.imageUrl;
            } else {
                counterImageWrapper.classList.remove("visible");
                counterImage.removeAttribute("src");
            }

            settingsView.classList.add("hidden");
            counterView.classList.remove("hidden");

            updateCounterDisplay();
            timerId = setInterval(updateCounterDisplay, 1000);
        }

        function enterSettingsMode() {
            if (timerId !== null) {
                clearInterval(timerId);
                timerId = null;
            }

            counterView.classList.add("hidden");
            settingsView.classList.remove("hidden");
        }

        function applyInputsToState() {
            const name = (nameInput.value || "").trim();
            state.name = name || "Процентный счётчик";

            const imageUrl = (imageInput.value || "").trim();
            state.imageUrl = imageUrl;

            const startDateStr = startDateInput.value || getNowAsLocalInputString();
            state.startDateString = startDateStr;
            state.startDate = new Date(startDateStr);

            const amount = parseAmount(amountInput.value || "1000000");
            const rate = parseRate(rateInput.value || "10");

            state.initialAmount = amount;
            state.rate = rate;

            return { amount, rate };
        }

        function initFromUrlParams() {
            const params = new URLSearchParams(window.location.search);
            if ([...params.keys()].length === 0) {
                // дефолтные значения
                const nowStr = getNowAsLocalInputString();
                startDateInput.value = nowStr;
                amountInput.value = "1000000";
                rateInput.value = "10";
                return;
            }

            const name = params.get("name") || "";
            const image = params.get("image") || "";
            const startDate = params.get("startDate") || "";
            const amount = params.get("amount") || "";
            const rate = params.get("rate") || "";
            const autoStartParam = params.get("autoStart") || "";

            if (name) {
                nameInput.value = name;
            }
            if (image) {
                imageInput.value = image;
                if (isValidImageUrl(image)) {
                    loadPreviewImage(image);
                }
            }
            if (startDate) {
                startDateInput.value = startDate;
            } else {
                startDateInput.value = getNowAsLocalInputString();
            }

            if (amount) {
                amountInput.value = amount;
            } else {
                amountInput.value = "1000000";
            }

            if (rate) {
                rateInput.value = rate;
            } else {
                rateInput.value = "10";
            }

            const autoStart = autoStartParam.toLowerCase() === "true";

            if (autoStart) {
                const { amount: parsedAmount, rate: parsedRate } = applyInputsToState();

                if (!Number.isFinite(parsedAmount) || parsedAmount <= 0) {
                    showToast("Некорректная начальная сумма в ссылке.", "error");
                    return;
                }
                if (!Number.isFinite(parsedRate)) {
                    showToast("Некорректная ставка в ссылке.", "error");
                    return;
                }

                enterCounterMode();
            }
        }

        // ===== Обработчики =====

        loadImageBtn.addEventListener("click", function () {
            const url = (imageInput.value || "").trim();
            loadPreviewImage(url);
        });

        clearImageBtn.addEventListener("click", function () {
            clearPreviewImage();
        });

        startCounterBtn.addEventListener("click", function () {
            const { amount, rate } = applyInputsToState();

            if (!Number.isFinite(amount) || amount <= 0) {
                showToast("Введите корректную начальную сумму.", "error");
                return;
            }
            if (!Number.isFinite(rate)) {
                showToast("Введите корректную годовую ставку.", "error");
                return;
            }

            const url = buildUrlFromState();
            try {
                window.history.replaceState({}, "", url);
            } catch (e) {
                // игнорируем, если браузер не позволил
            }

            copyToClipboard(url).then((ok) => {
                if (ok) {
                    showToast("🔗 Ссылка на счётчик скопирована в буфер обмена.", "success");
                } else {
                    showToast("Не удалось автоматически скопировать ссылку.", "error");
                }
            });

            enterCounterMode();
        });

        backToSettingsBtn.addEventListener("click", function () {
            enterSettingsMode();
        });

        shareBtn.addEventListener("click", function () {
            const currentUrl = window.location.href;
            copyToClipboard(currentUrl).then((ok) => {
                if (ok) {
                    showToast("🔗 Текущая ссылка скопирована в буфер обмена.", "success");
                } else {
                    showToast("Не удалось скопировать ссылку.", "error");
                }
            });
        });

        // Инициализация
        document.addEventListener("DOMContentLoaded", function () {
            initFromUrlParams();
            if (!startDateInput.value) {
                startDateInput.value = getNowAsLocalInputString();
            }
            if (!amountInput.value) {
                amountInput.value = "1000000";
            }
            if (!rateInput.value) {
                rateInput.value = "10";
            }
        });
    })();
</script>
</body>
</html>
