<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Процентный счётчик</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: clamp(1.5em, 4vw, 1.8em);
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .stop-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
        }

        .share-btn {
            background: linear-gradient(135deg, #20c997 0%, #1a9f7a 100%);
        }

        .remove-btn {
            background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
            padding: 8px;
            font-size: 14px;
            margin-top: 5px;
        }

        .result {
            margin-top: 25px;
            text-align: center;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 15px;
            border: 2px dashed #ddd;
        }

        .percentage {
            font-size: clamp(2em, 8vw, 3.5em);
            font-weight: bold;
            color: #667eea;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            overflow-wrap: break-word;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        .info {
            color: #888;
            font-size: clamp(0.8em, 3vw, 0.9em);
            margin-top: 10px;
            line-height: 1.5;
        }

        .config-mode {
            display: block;
        }

        .counter-mode {
            display: none;
        }

        .image-preview {
            width: 100%;
            max-width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 10px;
            margin: 10px auto;
            display: block;
        }

        .counter-image {
            width: 100%;
            max-width: 300px;
            max-height: 250px;
            object-fit: contain;
            border-radius: 15px;
            margin-bottom: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .counter-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .counter-title {
            margin: 0;
            font-size: clamp(1.4em, 5vw, 1.7em);
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #20c997;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
            max-width: 300px;
        }

        .notification.show {
            transform: translateX(0);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .button-group button {
            margin-top: 0;
            flex: 1;
        }

        .url-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .url-input-group input {
            flex: 1;
            margin-bottom: 0;
        }

        .url-input-group button {
            width: auto;
            min-width: 120px;
            margin-top: 0;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
                margin: 10px;
            }

            .percentage {
                font-size: 2.2em;
            }

            .counter-image {
                max-width: 250px;
                max-height: 200px;
            }

            .button-group, .url-input-group {
                flex-direction: column;
            }

            .url-input-group button {
                width: 100%;
            }

            .notification {
                right: 10px;
                left: 10px;
                max-width: none;
            }
        }

        @media (min-width: 768px) {
            .percentage {
                font-size: 3em;
            }

            .counter-image {
                max-width: 350px;
                max-height: 280px;
            }
        }

        @media (min-width: 1200px) {
            .container {
                max-width: 550px;
            }

            .percentage {
                font-size: 3.2em;
            }
        }
    </style>
</head>
<body>
<!-- Уведомление -->
<div class="notification" id="notification">
    Ссылка скопирована в буфер обмена!
</div>

<div class="container">
    <!-- Режим настройки -->
    <div class="config-mode" id="configMode">
        <h1>⚙️ Настройки</h1>

        <div class="input-group">
            <label for="counterName">Название:</label>
            <input type="text" id="counterName" placeholder="Мой инвестиционный счёт" value="Мой инвестиционный счёт">
        </div>

        <div class="input-group">
            <label for="imageUrl">Ссылка на картинку:</label>
            <div class="url-input-group">
                <input type="url" id="imageUrl" placeholder="https://example.com/image.jpg">
                <button onclick="loadImageFromUrl()">Загрузить</button>
            </div>

            <div class="image-controls">
                <img id="imagePreview" class="image-preview" style="display: none;">
                <button id="removeImageBtn" class="remove-btn" style="display: none;">Убрать картинку</button>
            </div>
        </div>

        <div class="input-group">
            <label for="startDate">Дата начала:</label>
            <input type="datetime-local" id="startDate">
        </div>

        <div class="input-group">
            <label for="initialAmount">Начальная сумма:</label>
            <input type="number" id="initialAmount" value="1000000" step="1000">
        </div>

        <div class="input-group">
            <label for="interestRate">Ставка (%):</label>
            <input type="text" id="interestRate" value="10">
        </div>

        <button onclick="startAndShare()" class="share-btn">Запустить счётчик</button>
    </div>

    <!-- Режим счётчика -->
    <div class="counter-mode" id="counterMode">
        <div class="counter-header">
            <h1 class="counter-title" id="counterTitle">💰 Счётчик</h1>
        </div>

        <div class="counter-header-i">
            <img id="counterImage" class="counter-image" style="display: none;" onerror="handleImageError()">
        </div>

        <div class="result">
            <div class="percentage" id="percentageDisplay">0.00</div>
            <div class="info" id="info"></div>
        </div>

        <div class="button-group">
            <button onclick="stopCounter()" class="stop-btn">Настройки</button>
            <button onclick="shareCounter()" class="share-btn">Поделиться</button>
        </div>
    </div>
</div>

<script>
    let counterInterval = null;
    let startTime = null;
    let initialAmount = 0;
    let annualRate = 0;
    let counterName = "";
    let imageUrl = null;

    // Элементы DOM
    const configMode = document.getElementById('configMode');
    const counterMode = document.getElementById('counterMode');
    const counterTitle = document.getElementById('counterTitle');
    const notification = document.getElementById('notification');
    const imagePreview = document.getElementById('imagePreview');
    const counterImage = document.getElementById('counterImage');
    const removeImageBtn = document.getElementById('removeImageBtn');
    const imageUrlInput = document.getElementById('imageUrl');

    // Инициализация при загрузке
    function init() {
        initFromURL();
    }

    // Инициализация из URL параметров
    function initFromURL() {
        const urlParams = new URLSearchParams(window.location.search);

        // Название
        const urlName = urlParams.get('name');
        if (urlName) {
            document.getElementById('counterName').value = decodeURIComponent(urlName);
        }

        // Ссылка на картинку
        const urlImage = urlParams.get('image');
        if (urlImage) {
            imageUrl = decodeURIComponent(urlImage);
            imageUrlInput.value = imageUrl;
            loadImagePreview(imageUrl);
        }

        // Дата начала
        const urlStartDate = urlParams.get('startDate');
        if (urlStartDate) {
            document.getElementById('startDate').value = urlStartDate;
        } else {
            // Устанавливаем текущую дату и время по умолчанию
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('startDate').value = now.toISOString().slice(0, 16);
        }

        // Начальная сумма
        const urlAmount = urlParams.get('amount');
        if (urlAmount) {
            document.getElementById('initialAmount').value = urlAmount;
        } else {
            document.getElementById('initialAmount').value = 1000000;
        }

        // Процентная ставка
        const urlRate = urlParams.get('rate');
        if (urlRate) {
            document.getElementById('interestRate').value = urlRate;
        }

        // Автозапуск из URL
        const urlAutoStart = urlParams.get('autoStart');
        if (urlAutoStart === 'true') {
            setTimeout(() => startCounter(), 100);
        }
    }

    // Загрузка картинки по URL
    function loadImageFromUrl() {
        const url = imageUrlInput.value.trim();
        if (!url) {
            showNotification('Введите ссылку на картинку', 'error');
            return;
        }

        if (!isValidImageUrl(url)) {
            showNotification('Введите корректную ссылку на картинку (jpg, png, gif, webp, svg)', 'error');
            return;
        }

        loadImagePreview(url);
        showNotification('Картинка загружена');
    }

    // Проверка валидности URL картинки
    function isValidImageUrl(url) {
        try {
            const urlObj = new URL(url);
            const imageExtensions = ['.jpg', '.jpeg', '.png', '.gif', '.webp', '.svg'];
            const pathname = urlObj.pathname.toLowerCase();
            return imageExtensions.some(ext => pathname.endsWith(ext)) ||
                urlObj.hostname.includes('imgur') ||
                urlObj.hostname.includes('cloudinary') ||
                pathname.includes('image') ||
                pathname.includes('picture');
        } catch {
            return false;
        }
    }

    // Загрузка превью картинки
    function loadImagePreview(url) {
        imageUrl = url;
        imagePreview.src = url;
        imagePreview.style.display = 'block';
        counterImage.src = url;
        counterImage.style.display = 'block';
        removeImageBtn.style.display = 'block';
    }

    // Обработчик ошибки загрузки картинки
    function handleImageError() {
        showNotification('Ошибка загрузки картинки', 'error');
        counterImage.style.display = 'none';
    }

    // Обработчик кнопки удаления картинки
    removeImageBtn.addEventListener('click', function() {
        imageUrl = null;
        imagePreview.style.display = 'none';
        counterImage.style.display = 'none';
        removeImageBtn.style.display = 'none';
        imageUrlInput.value = '';
        showNotification('Картинка удалена');
    });

    function startCounter() {
        // Получаем значения из полей ввода
        const startDateValue = document.getElementById('startDate').value;
        counterName = document.getElementById('counterName').value;
        initialAmount = parseFloat(document.getElementById('initialAmount').value);
        annualRate = parseFloat(document.getElementById('interestRate').value.replace(',', '.'));

        if (isNaN(initialAmount) || isNaN(annualRate) || !startDateValue || !counterName) {
            showNotification('Пожалуйста, заполните все поля корректно', 'error');
            return;
        }

        startTime = new Date(startDateValue);

        // Устанавливаем название и картинку
        counterTitle.textContent = counterName;
        if (imageUrl) {
            counterImage.style.display = 'block';
        } else {
            counterImage.style.display = 'none';
        }

        // Переключаемся в режим счётчика
        configMode.style.display = 'none';
        counterMode.style.display = 'block';

        // Обновляем отображение
        updateDisplay(initialAmount);

        // Запускаем обновление каждую секунду
        if (counterInterval) {
            clearInterval(counterInterval);
        }
        counterInterval = setInterval(updateCounter, 1000);
    }

    function startAndShare() {
        startCounter();
        if (counterMode.style.display === 'block') {
            const shareUrl = generateShareLink();
            copyToClipboard(shareUrl);
            showNotification('Счётчик запущен и ссылка скопирована!');
        }
    }

    function stopCounter() {
        if (counterInterval) {
            clearInterval(counterInterval);
            counterInterval = null;
        }

        // Возвращаемся в режим настройки
        configMode.style.display = 'block';
        counterMode.style.display = 'none';
    }

    function updateCounter() {
        const now = new Date();
        const elapsedSeconds = (now - startTime) / 1000;

        if (elapsedSeconds < 0) {
            // Если дата начала в будущем
            document.getElementById('info').textContent = 'Ожидание начала...';
            updateDisplay(initialAmount);
            return;
        }

        // Рассчитываем сумму с учётом сложных процентов
        const elapsedYears = elapsedSeconds / (365 * 24 * 60 * 60);
        const currentAmount = initialAmount * Math.pow(1 + annualRate/100, elapsedYears);

        updateDisplay(currentAmount);

        // Обновляем информацию о времени
        const elapsedDays = Math.floor(elapsedSeconds / (24 * 60 * 60));
        const elapsedHours = Math.floor((elapsedSeconds % (24 * 60 * 60)) / (60 * 60));
        const elapsedMinutes = Math.floor((elapsedSeconds % (60 * 60)) / 60);
        const elapsedSecs = Math.floor(elapsedSeconds % 60);

        const startDate = new Date(startTime);
        const formattedDate = startDate.toLocaleDateString('ru-RU');

        document.getElementById('info').innerHTML =
            `Прошло: ${elapsedDays}д ${elapsedHours}ч ${elapsedMinutes}м ${elapsedSecs}с<br>` +
            `(${formatNumber(initialAmount)} с ${formattedDate} под ${annualRate}%)`;
    }

    function updateDisplay(amount) {
        const percentageElement = document.getElementById('percentageDisplay');

        // Форматируем число без разделителей тысяч
        const formattedAmount = formatNumber(amount);

        // Плавное изменение числа
        percentageElement.textContent = formattedAmount;
    }

    // Форматирование чисел без разделителей тысяч
    function formatNumber(number) {
        return number.toFixed(2);
    }

    function generateShareLink() {
        const baseUrl = window.location.origin + window.location.pathname;
        const params = new URLSearchParams({
            name: counterName,
            startDate: document.getElementById('startDate').value,
            amount: initialAmount,
            rate: annualRate,
            autoStart: 'true'
        });

        // Добавляем ссылку на картинку если есть
        if (imageUrl) {
            params.set('image', encodeURIComponent(imageUrl));
        }

        const shareUrl = `${baseUrl}?${params.toString()}`;
        return shareUrl;
    }

    function shareCounter() {
        const shareUrl = generateShareLink();
        copyToClipboard(shareUrl);
        showNotification('Ссылка скопирована в буфер обмена!');
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text)
            .then(() => {})
            .catch(() => {
                // Fallback для старых браузеров
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
            });
    }

    function showNotification(message, type = 'success') {
        notification.textContent = message;
        notification.className = 'notification';

        if (type === 'error') {
            notification.style.background = '#ff6b6b';
        } else {
            notification.style.background = '#20c997';
        }

        notification.classList.add('show');

        setTimeout(() => {
            notification.classList.remove('show');
        }, 3000);
    }

    // Инициализация при загрузке
    window.onload = init;
</script>
</body>
</html>
