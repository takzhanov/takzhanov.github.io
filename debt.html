<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Процентный счётчик</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6C63FF;
            --primary-light: #8A84FF;
            --primary-dark: #5752CC;
            --secondary: #FF6584;
            --accent: #00D4AA;
            --dark: #2A2D3E;
            --light: #F7F9FC;
            --gray: #A0A4B8;
            --border-radius: 16px;
            --shadow: 0 10px 30px rgba(108, 99, 255, 0.15);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Montserrat', sans-serif;
            color: var(--dark);
        }

        .container {
            background-color: var(--light);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 700px;
            overflow: hidden;
            transition: var(--transition);
        }

        .page {
            padding: 35px;
            display: none;
        }

        .active {
            display: block;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: var(--primary);
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: var(--dark);
            font-weight: 600;
            position: relative;
            display: inline-block;
        }

        h2:after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 50px;
            height: 3px;
            background: var(--accent);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
            color: var(--dark);
            font-size: 0.95rem;
        }

        input, button {
            width: 100%;
            padding: 14px 18px;
            border-radius: 10px;
            border: 2px solid #E6E9F0;
            font-size: 16px;
            transition: var(--transition);
            font-family: 'Montserrat', sans-serif;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.2);
        }

        button {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        button:after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            opacity: 0;
            transition: var(--transition);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(108, 99, 255, 0.3);
        }

        button:hover:after {
            opacity: 1;
        }

        button span {
            position: relative;
            z-index: 1;
        }

        button.secondary {
            background: var(--light);
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        button.secondary:hover {
            background: var(--primary);
            color: white;
        }

        .image-preview {
            margin-top: 15px;
            text-align: center;
            display: none;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .image-preview img {
            max-width: 100%;
            max-height: 250px;
            object-fit: contain;
        }

        .counter-display {
            text-align: center;
            padding: 20px 0;
        }

        .counter-image {
            max-width: 100%;
            max-height: 320px;
            margin: 0 auto 25px;
            display: none;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .counter-image img {
            max-width: 100%;
            max-height: 320px;
            object-fit: contain;
        }

        .counter-title {
            font-size: 2rem;
            margin-bottom: 30px;
            color: var(--primary);
            font-weight: 700;
        }

        .counter-value {
            font-family: 'Roboto Mono', monospace;
            font-size: clamp(2.8rem, 6vw, 5rem);
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--primary);
            overflow: hidden;
            min-height: 1.2em;
            letter-spacing: -1px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .counter-info {
            margin-bottom: 12px;
            font-size: 1.2rem;
            color: var(--dark);
            font-weight: 500;
        }

        .counter-details {
            color: var(--gray);
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .counter-controls {
            display: flex;
            gap: 15px;
            margin-top: 35px;
        }

        .counter-controls button {
            flex: 1;
        }

        .notification {
            position: fixed;
            top: 25px;
            right: 25px;
            padding: 16px 22px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            transform: translateX(150%);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background: linear-gradient(135deg, var(--accent), #00B894);
        }

        .notification.error {
            background: linear-gradient(135deg, var(--secondary), #E84393);
        }

        .notification-icon {
            font-size: 1.2rem;
        }

        .image-controls {
            display: flex;
            gap: 12px;
        }

        .image-controls button {
            flex: 1;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .tag {
            display: inline-block;
            background: rgba(108, 99, 255, 0.1);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-left: 8px;
        }

        @media (max-width: 768px) {
            .page {
                padding: 25px;
            }

            .counter-controls {
                flex-direction: column;
            }

            .counter-image img {
                max-height: 250px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }

        @media (max-width: 480px) {
            .page {
                padding: 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            h2 {
                font-size: 1.3rem;
            }
        }

        /* Анимация загрузки для изображений */
        .loading {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        /* Анимация появления */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Страница настроек -->
    <div id="settings-page" class="page active">
        <div class="header">
            <h1>💰 Процентный счётчик</h1>
            <p>Создайте свой счётчик сложных процентов</p>
        </div>

        <h2>Настройки</h2>

        <div class="form-group">
            <label for="counter-name">Название счётчика <span class="tag">Обязательно</span></label>
            <input type="text" id="counter-name" placeholder="Введите название" value="Мой инвестиционный счёт">
        </div>

        <div class="form-group">
            <label for="image-url">Ссылка на картинку</label>
            <input type="url" id="image-url" placeholder="https://example.com/image.jpg" value="https://images.unsplash.com/photo-1554224155-6726b3ff858f?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1000&q=80">
            <div class="image-controls">
                <button id="load-image" class="secondary"><span>🖼️ Загрузить</span></button>
                <button id="remove-image" class="secondary"><span>❌ Убрать картинку</span></button>
            </div>
            <div id="image-preview" class="image-preview">
                <img src="" alt="Предпросмотр">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="start-date">Дата и время начала <span class="tag">Обязательно</span></label>
                <input type="datetime-local" id="start-date">
            </div>

            <div class="form-group">
                <label for="initial-amount">Начальная сумма</label>
                <input type="number" id="initial-amount" value="1000000" min="0" step="1000">
            </div>
        </div>

        <div class="form-group">
            <label for="annual-rate">Годовая ставка (%) <span class="tag">Обязательно</span></label>
            <input type="text" id="annual-rate" placeholder="Например: 10.5" value="12.5">
        </div>

        <button id="start-counter"><span>🚀 Запустить счётчик</span></button>
    </div>

    <!-- Страница счётчика -->
    <div id="counter-page" class="page">
        <div id="counter-image" class="counter-image">
            <img src="" alt="Изображение счётчика">
        </div>

        <h2 id="counter-title" class="counter-title"></h2>

        <div class="counter-display">
            <div id="counter-value" class="counter-value">0.00</div>
            <div id="counter-info" class="counter-info"></div>
            <div id="counter-details" class="counter-details"></div>
        </div>

        <div class="counter-controls">
            <button id="back-to-settings" class="secondary"><span>⚙️ Настройки</span></button>
            <button id="share-counter"><span>📤 Поделиться</span></button>
        </div>
    </div>
</div>

<div id="notification" class="notification">
    <span class="notification-icon">💫</span>
    <span class="notification-text"></span>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Элементы страницы настроек
        const settingsPage = document.getElementById('settings-page');
        const counterPage = document.getElementById('counter-page');
        const counterNameInput = document.getElementById('counter-name');
        const imageUrlInput = document.getElementById('image-url');
        const loadImageBtn = document.getElementById('load-image');
        const removeImageBtn = document.getElementById('remove-image');
        const imagePreview = document.getElementById('image-preview');
        const startDateInput = document.getElementById('start-date');
        const initialAmountInput = document.getElementById('initial-amount');
        const annualRateInput = document.getElementById('annual-rate');
        const startCounterBtn = document.getElementById('start-counter');

        // Элементы страницы счётчика
        const counterImage = document.getElementById('counter-image');
        const counterTitle = document.getElementById('counter-title');
        const counterValue = document.getElementById('counter-value');
        const counterInfo = document.getElementById('counter-info');
        const counterDetails = document.getElementById('counter-details');
        const backToSettingsBtn = document.getElementById('back-to-settings');
        const shareCounterBtn = document.getElementById('share-counter');

        // Уведомление
        const notification = document.getElementById('notification');
        const notificationText = notification.querySelector('.notification-text');

        // Установка текущей даты и времени по умолчанию
        const now = new Date();
        // Устанавливаем на 30 дней назад для демонстрации
        const monthAgo = new Date(now);
        monthAgo.setDate(monthAgo.getDate() - 30);
        startDateInput.value = monthAgo.toISOString().slice(0, 16);

        // Загружаем изображение по умолчанию
        setTimeout(() => {
            loadDefaultImage();
        }, 500);

        // Переменные для работы счётчика
        let updateInterval;

        // Загрузка изображения для предпросмотра
        loadImageBtn.addEventListener('click', function() {
            const imageUrl = imageUrlInput.value.trim();

            if (!imageUrl) {
                showNotification('Введите URL изображения', 'error');
                return;
            }

            loadImagePreview(imageUrl);
        });

        // Удаление изображения
        removeImageBtn.addEventListener('click', function() {
            imagePreview.style.display = 'none';
            imageUrlInput.value = '';
            showNotification('Изображение удалено', 'success');
        });

        // Запуск счётчика
        startCounterBtn.addEventListener('click', function() {
            // Валидация данных
            if (!validateForm()) {
                return;
            }

            // Сохранение данных
            const counterData = {
                name: counterNameInput.value,
                imageUrl: imageUrlInput.value,
                startDate: startDateInput.value,
                initialAmount: parseFloat(initialAmountInput.value),
                annualRate: parseFloat(annualRateInput.value.replace(',', '.'))
            };

            // Переключение на страницу счётчика
            switchToCounterPage(counterData);

            // Копирование ссылки в буфер
            copyShareUrl(counterData);
        });

        // Возврат к настройкам
        backToSettingsBtn.addEventListener('click', function() {
            clearInterval(updateInterval);
            settingsPage.classList.add('active');
            counterPage.classList.remove('active');
        });

        // Поделиться счётчиком
        shareCounterBtn.addEventListener('click', function() {
            const counterData = getCounterDataFromUrl() || {
                name: counterTitle.textContent,
                imageUrl: counterImage.querySelector('img').src,
                startDate: document.getElementById('start-date').value,
                initialAmount: parseFloat(document.getElementById('initial-amount').value),
                annualRate: parseFloat(document.getElementById('annual-rate').value.replace(',', '.'))
            };

            copyShareUrl(counterData);
        });

        // Загрузка изображения по умолчанию
        function loadDefaultImage() {
            const defaultImageUrl = imageUrlInput.value;
            if (defaultImageUrl) {
                loadImagePreview(defaultImageUrl);
            }
        }

        // Загрузка изображения для предпросмотра
        function loadImagePreview(imageUrl) {
            // Очистка параметров из URL для проверки
            const cleanUrl = imageUrl.split('?')[0];

            if (!isValidImageUrl(cleanUrl)) {
                showNotification('Некорректный URL изображения', 'error');
                return;
            }

            const img = imagePreview.querySelector('img');
            img.classList.add('loading');
            imagePreview.style.display = 'block';

            img.onload = function() {
                img.classList.remove('loading');
                showNotification('Изображение загружено', 'success');
            };

            img.onerror = function() {
                img.classList.remove('loading');
                imagePreview.style.display = 'none';
                showNotification('Ошибка загрузки изображения', 'error');
            };

            img.src = imageUrl;
        }

        // Валидация формы
        function validateForm() {
            if (!counterNameInput.value.trim()) {
                showNotification('Введите название счётчика', 'error');
                return false;
            }

            if (!startDateInput.value) {
                showNotification('Укажите дату начала', 'error');
                return false;
            }

            const startDate = new Date(startDateInput.value);
            if (startDate > new Date()) {
                showNotification('Дата начала не может быть в будущем', 'error');
                return false;
            }

            if (!initialAmountInput.value || parseFloat(initialAmountInput.value) <= 0) {
                showNotification('Введите корректную начальную сумму', 'error');
                return false;
            }

            const rate = annualRateInput.value.replace(',', '.');
            if (!rate || isNaN(parseFloat(rate)) || parseFloat(rate) <= 0) {
                showNotification('Введите корректную годовую ставку', 'error');
                return false;
            }

            return true;
        }

        // Переключение на страницу счётчика
        function switchToCounterPage(counterData) {
            // Обновление данных на странице счётчика
            counterTitle.textContent = counterData.name;

            if (counterData.imageUrl) {
                const img = counterImage.querySelector('img');
                img.src = counterData.imageUrl;
                counterImage.style.display = 'block';

                img.onerror = function() {
                    counterImage.style.display = 'none';
                };
            } else {
                counterImage.style.display = 'none';
            }

            // Переключение страниц
            settingsPage.classList.remove('active');
            counterPage.classList.add('active');

            // Добавляем анимацию появления
            const elements = counterPage.querySelectorAll('.counter-title, .counter-value, .counter-info, .counter-details, .counter-controls');
            elements.forEach((el, index) => {
                el.classList.add('fade-in');
                el.style.animationDelay = `${index * 0.1}s`;
            });

            // Запуск обновления счётчика
            updateCounter(counterData);
            updateInterval = setInterval(() => updateCounter(counterData), 100);
        }

        // Обновление счётчика
        function updateCounter(counterData) {
            const startDate = new Date(counterData.startDate);
            const now = new Date();
            const elapsedSeconds = Math.max(0, (now - startDate) / 1000);

            // Расчет текущей суммы по формуле сложных процентов
            const elapsedYears = elapsedSeconds / (365 * 24 * 60 * 60);
            const currentAmount = counterData.initialAmount *
                Math.pow(1 + counterData.annualRate / 100, elapsedYears);

            // Форматирование времени
            const days = Math.floor(elapsedSeconds / (24 * 60 * 60));
            const hours = Math.floor((elapsedSeconds % (24 * 60 * 60)) / (60 * 60));
            const minutes = Math.floor((elapsedSeconds % (60 * 60)) / 60);
            const seconds = Math.floor(elapsedSeconds % 60);

            // Обновление отображения
            animateNumber(counterValue, currentAmount);
            counterInfo.textContent = `Прошло: ${days}д ${hours}ч ${minutes}м ${seconds}с`;

            const formattedDate = startDate.toLocaleDateString('ru-RU');
            const formattedInitialAmount = formatNumber(counterData.initialAmount);
            counterDetails.textContent =
                `(начальная сумма ${formattedInitialAmount} с ${formattedDate} под ${counterData.annualRate}%)`;
        }

        // Анимация числа
        function animateNumber(element, targetValue) {
            const currentText = element.textContent.replace(/\s/g, '').replace(',', '.');
            const currentValue = parseFloat(currentText) || 0;

            if (Math.abs(currentValue - targetValue) < 0.01) {
                element.textContent = formatCurrency(targetValue);
                return;
            }

            // Плавное изменение значения
            const diff = targetValue - currentValue;
            const change = diff * 0.1; // 10% от разницы

            element.textContent = formatCurrency(currentValue + change);
        }

        // Форматирование валюты (с копейками и разделителями тысяч)
        function formatCurrency(num) {
            // Форматируем с двумя знаками после запятой
            const formatted = num.toFixed(2);

            // Разделяем на целую и дробную части
            const parts = formatted.split('.');
            let integerPart = parts[0];
            const decimalPart = parts[1];

            // Добавляем разделители тысяч
            integerPart = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

            return `${integerPart}.${decimalPart}`;
        }

        // Форматирование числа (без копеек)
        function formatNumber(num) {
            return num.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
        }

        // Проверка валидности URL изображения
        function isValidImageUrl(url) {
            // Разрешаем все URL, так как многие содержат параметры
            // Более строгая проверка может блокировать рабочие URL
            return url.length > 0;
        }

        // Показать уведомление
        function showNotification(message, type) {
            notificationText.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');

            // Обновляем иконку в зависимости от типа уведомления
            const icon = notification.querySelector('.notification-icon');
            icon.textContent = type === 'success' ? '✅' : '❌';

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Копирование ссылки для общего доступа
        function copyShareUrl(counterData) {
            const params = new URLSearchParams();
            params.set('name', counterData.name);
            if (counterData.imageUrl) params.set('image', encodeURIComponent(counterData.imageUrl));
            params.set('startDate', counterData.startDate);
            params.set('amount', counterData.initialAmount);
            params.set('rate', counterData.annualRate);
            params.set('autoStart', 'true');

            const shareUrl = `${window.location.origin}${window.location.pathname}?${params.toString()}`;

            navigator.clipboard.writeText(shareUrl)
                .then(() => {
                    showNotification('Ссылка скопирована в буфер!', 'success');
                })
                .catch(() => {
                    // Fallback для старых браузеров
                    const textArea = document.createElement('textarea');
                    textArea.value = shareUrl;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    showNotification('Ссылка скопирована в буфер!', 'success');
                });
        }

        // Получение данных счётчика из URL
        function getCounterDataFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);

            if (!urlParams.has('autoStart')) return null;

            try {
                return {
                    name: urlParams.get('name') || 'Мой инвестиционный счёт',
                    imageUrl: urlParams.has('image') ? decodeURIComponent(urlParams.get('image')) : '',
                    startDate: urlParams.get('startDate'),
                    initialAmount: parseFloat(urlParams.get('amount')),
                    annualRate: parseFloat(urlParams.get('rate'))
                };
            } catch (e) {
                console.error('Ошибка при разборе параметров URL:', e);
                return null;
            }
        }

        // Автозапуск счётчика при наличии параметров в URL
        const urlCounterData = getCounterDataFromUrl();
        if (urlCounterData) {
            // Заполняем форму данными из URL
            counterNameInput.value = urlCounterData.name;
            imageUrlInput.value = urlCounterData.imageUrl;
            startDateInput.value = urlCounterData.startDate;
            initialAmountInput.value = urlCounterData.initialAmount;
            annualRateInput.value = urlCounterData.annualRate;

            // Загружаем изображение, если есть
            if (urlCounterData.imageUrl) {
                loadImagePreview(urlCounterData.imageUrl);
            }

            // Запускаем счётчик
            setTimeout(() => {
                switchToCounterPage(urlCounterData);
            }, 500);
        }
    });
</script>
</body>
</html>
