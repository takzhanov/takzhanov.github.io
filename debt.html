<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Процентный счётчик</title>
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --white: #ffffff;
            --text-color: #333333;
            --border-radius: 12px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-color);
        }

        .container {
            background-color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 600px;
            overflow: hidden;
            transition: var(--transition);
        }

        .page {
            padding: 30px;
            display: none;
        }

        .active {
            display: block;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--primary-color);
            font-weight: 600;
        }

        h2 {
            margin-bottom: 20px;
            font-weight: 500;
            color: var(--secondary-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input, button {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 16px;
            transition: var(--transition);
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 500;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }

        button.secondary {
            background-color: #f0f0f0;
            color: var(--text-color);
        }

        button.secondary:hover {
            background-color: #e0e0e0;
        }

        .image-preview {
            margin-top: 15px;
            text-align: center;
            display: none;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 8px;
            object-fit: contain;
        }

        .counter-display {
            text-align: center;
            padding: 20px 0;
        }

        .counter-image {
            max-width: 100%;
            max-height: 300px;
            margin: 0 auto 20px;
            display: none;
        }

        .counter-image img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            object-fit: contain;
        }

        .counter-title {
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: var(--secondary-color);
        }

        .counter-value {
            font-family: 'Courier New', Courier, monospace;
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--primary-color);
            overflow: hidden;
            min-height: 1.2em;
        }

        .counter-info {
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .counter-details {
            color: #666;
            font-size: 1rem;
        }

        .counter-controls {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transform: translateX(150%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background-color: #4CAF50;
        }

        .notification.error {
            background-color: #F44336;
        }

        .image-controls {
            display: flex;
            gap: 10px;
        }

        .image-controls button {
            flex: 1;
        }

        @media (max-width: 480px) {
            .page {
                padding: 20px;
            }

            .counter-controls {
                flex-direction: column;
            }

            .counter-image img {
                max-height: 250px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Страница настроек -->
    <div id="settings-page" class="page active">
        <h1>Настройки счётчика</h1>

        <div class="form-group">
            <label for="counter-name">Название счётчика</label>
            <input type="text" id="counter-name" placeholder="Введите название">
        </div>

        <div class="form-group">
            <label for="image-url">Ссылка на картинку</label>
            <input type="url" id="image-url" placeholder="https://example.com/image.jpg">
            <div class="image-controls">
                <button id="load-image" class="secondary">Загрузить</button>
                <button id="remove-image" class="secondary">Убрать картинку</button>
            </div>
            <div id="image-preview" class="image-preview">
                <img src="" alt="Предпросмотр">
            </div>
        </div>

        <div class="form-group">
            <label for="start-date">Дата и время начала</label>
            <input type="datetime-local" id="start-date">
        </div>

        <div class="form-group">
            <label for="initial-amount">Начальная сумма</label>
            <input type="number" id="initial-amount" value="1000000" min="0">
        </div>

        <div class="form-group">
            <label for="annual-rate">Годовая ставка (%)</label>
            <input type="text" id="annual-rate" placeholder="10.5">
        </div>

        <button id="start-counter">Запустить счётчик</button>
    </div>

    <!-- Страница счётчика -->
    <div id="counter-page" class="page">
        <div id="counter-image" class="counter-image">
            <img src="" alt="Изображение счётчика">
        </div>

        <h2 id="counter-title" class="counter-title"></h2>

        <div class="counter-display">
            <div id="counter-value" class="counter-value">0</div>
            <div id="counter-info" class="counter-info"></div>
            <div id="counter-details" class="counter-details"></div>
        </div>

        <div class="counter-controls">
            <button id="back-to-settings" class="secondary">Настройки</button>
            <button id="share-counter">Поделиться</button>
        </div>
    </div>
</div>

<div id="notification" class="notification"></div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Элементы страницы настроек
        const settingsPage = document.getElementById('settings-page');
        const counterPage = document.getElementById('counter-page');
        const counterNameInput = document.getElementById('counter-name');
        const imageUrlInput = document.getElementById('image-url');
        const loadImageBtn = document.getElementById('load-image');
        const removeImageBtn = document.getElementById('remove-image');
        const imagePreview = document.getElementById('image-preview');
        const startDateInput = document.getElementById('start-date');
        const initialAmountInput = document.getElementById('initial-amount');
        const annualRateInput = document.getElementById('annual-rate');
        const startCounterBtn = document.getElementById('start-counter');

        // Элементы страницы счётчика
        const counterImage = document.getElementById('counter-image');
        const counterTitle = document.getElementById('counter-title');
        const counterValue = document.getElementById('counter-value');
        const counterInfo = document.getElementById('counter-info');
        const counterDetails = document.getElementById('counter-details');
        const backToSettingsBtn = document.getElementById('back-to-settings');
        const shareCounterBtn = document.getElementById('share-counter');

        // Уведомление
        const notification = document.getElementById('notification');

        // Установка текущей даты и времени по умолчанию
        const now = new Date();
        startDateInput.value = now.toISOString().slice(0, 16);

        // Переменные для работы счётчика
        let updateInterval;

        // Загрузка изображения для предпросмотра
        loadImageBtn.addEventListener('click', function() {
            const imageUrl = imageUrlInput.value.trim();

            if (!imageUrl) {
                showNotification('Введите URL изображения', 'error');
                return;
            }

            if (!isValidImageUrl(imageUrl)) {
                showNotification('Некорректный URL изображения', 'error');
                return;
            }

            const img = imagePreview.querySelector('img');
            img.src = imageUrl;

            img.onload = function() {
                imagePreview.style.display = 'block';
                showNotification('Изображение загружено', 'success');
            };

            img.onerror = function() {
                imagePreview.style.display = 'none';
                showNotification('Ошибка загрузки изображения', 'error');
            };
        });

        // Удаление изображения
        removeImageBtn.addEventListener('click', function() {
            imagePreview.style.display = 'none';
            imageUrlInput.value = '';
            showNotification('Изображение удалено', 'success');
        });

        // Запуск счётчика
        startCounterBtn.addEventListener('click', function() {
            // Валидация данных
            if (!validateForm()) {
                return;
            }

            // Сохранение данных
            const counterData = {
                name: counterNameInput.value,
                imageUrl: imageUrlInput.value,
                startDate: startDateInput.value,
                initialAmount: parseFloat(initialAmountInput.value),
                annualRate: parseFloat(annualRateInput.value.replace(',', '.'))
            };

            // Переключение на страницу счётчика
            switchToCounterPage(counterData);

            // Копирование ссылки в буфер
            copyShareUrl(counterData);
        });

        // Возврат к настройкам
        backToSettingsBtn.addEventListener('click', function() {
            clearInterval(updateInterval);
            settingsPage.classList.add('active');
            counterPage.classList.remove('active');
        });

        // Поделиться счётчиком
        shareCounterBtn.addEventListener('click', function() {
            const counterData = getCounterDataFromUrl() || {
                name: counterTitle.textContent,
                imageUrl: counterImage.querySelector('img').src,
                startDate: document.getElementById('start-date').value,
                initialAmount: parseFloat(document.getElementById('initial-amount').value),
                annualRate: parseFloat(document.getElementById('annual-rate').value.replace(',', '.'))
            };

            copyShareUrl(counterData);
        });

        // Валидация формы
        function validateForm() {
            if (!counterNameInput.value.trim()) {
                showNotification('Введите название счётчика', 'error');
                return false;
            }

            if (!startDateInput.value) {
                showNotification('Укажите дату начала', 'error');
                return false;
            }

            const startDate = new Date(startDateInput.value);
            if (startDate > new Date()) {
                showNotification('Дата начала не может быть в будущем', 'error');
                return false;
            }

            if (!initialAmountInput.value || parseFloat(initialAmountInput.value) <= 0) {
                showNotification('Введите корректную начальную сумму', 'error');
                return false;
            }

            const rate = annualRateInput.value.replace(',', '.');
            if (!rate || isNaN(parseFloat(rate)) || parseFloat(rate) <= 0) {
                showNotification('Введите корректную годовую ставку', 'error');
                return false;
            }

            return true;
        }

        // Переключение на страницу счётчика
        function switchToCounterPage(counterData) {
            // Обновление данных на странице счётчика
            counterTitle.textContent = counterData.name;

            if (counterData.imageUrl) {
                const img = counterImage.querySelector('img');
                img.src = counterData.imageUrl;
                counterImage.style.display = 'block';

                img.onerror = function() {
                    counterImage.style.display = 'none';
                };
            } else {
                counterImage.style.display = 'none';
            }

            // Переключение страниц
            settingsPage.classList.remove('active');
            counterPage.classList.add('active');

            // Запуск обновления счётчика
            updateCounter(counterData);
            updateInterval = setInterval(() => updateCounter(counterData), 1000);
        }

        // Обновление счётчика
        function updateCounter(counterData) {
            const startDate = new Date(counterData.startDate);
            const now = new Date();
            const elapsedSeconds = Math.max(0, (now - startDate) / 1000);

            // Расчет текущей суммы по формуле сложных процентов
            const elapsedYears = elapsedSeconds / (365 * 24 * 60 * 60);
            const currentAmount = counterData.initialAmount *
                Math.pow(1 + counterData.annualRate / 100, elapsedYears);

            // Форматирование времени
            const days = Math.floor(elapsedSeconds / (24 * 60 * 60));
            const hours = Math.floor((elapsedSeconds % (24 * 60 * 60)) / (60 * 60));
            const minutes = Math.floor((elapsedSeconds % (60 * 60)) / 60);
            const seconds = Math.floor(elapsedSeconds % 60);

            // Обновление отображения
            animateNumber(counterValue, Math.floor(currentAmount));
            counterInfo.textContent = `Прошло: ${days}д ${hours}ч ${minutes}м ${seconds}с`;

            const formattedDate = startDate.toLocaleDateString('ru-RU');
            counterDetails.textContent =
                `(начальная сумма ${formatNumber(counterData.initialAmount)} с ${formattedDate} под ${counterData.annualRate}%)`;
        }

        // Анимация числа
        function animateNumber(element, targetValue) {
            const currentValue = parseFloat(element.textContent.replace(/\s/g, '')) || 0;

            if (currentValue === targetValue) return;

            // Простая анимация - сразу устанавливаем новое значение
            // В реальном приложении можно добавить плавную анимацию
            element.textContent = formatNumber(targetValue);
        }

        // Форматирование числа (без разделителей тысяч)
        function formatNumber(num) {
            return num.toString();
        }

        // Проверка валидности URL изображения
        function isValidImageUrl(url) {
            const imageExtensions = /\.(jpg|jpeg|png|gif|webp|svg)$/i;
            const imageHosts = [
                'imgur.com', 'picsum.photos', 'unsplash.com', 'pexels.com',
                'flickr.com', 'imageshack.com', 'postimg.cc', 'imgbox.com'
            ];

            return imageExtensions.test(url) ||
                imageHosts.some(host => url.includes(host));
        }

        // Показать уведомление
        function showNotification(message, type) {
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Копирование ссылки для общего доступа
        function copyShareUrl(counterData) {
            const params = new URLSearchParams();
            params.set('name', counterData.name);
            if (counterData.imageUrl) params.set('image', encodeURIComponent(counterData.imageUrl));
            params.set('startDate', counterData.startDate);
            params.set('amount', counterData.initialAmount);
            params.set('rate', counterData.annualRate);
            params.set('autoStart', 'true');

            const shareUrl = `${window.location.origin}${window.location.pathname}?${params.toString()}`;

            navigator.clipboard.writeText(shareUrl)
                .then(() => {
                    showNotification('Ссылка скопирована в буфер', 'success');
                })
                .catch(() => {
                    showNotification('Не удалось скопировать ссылку', 'error');
                });
        }

        // Получение данных счётчика из URL
        function getCounterDataFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);

            if (!urlParams.has('autoStart')) return null;

            try {
                return {
                    name: urlParams.get('name') || 'Мой счётчик',
                    imageUrl: urlParams.has('image') ? decodeURIComponent(urlParams.get('image')) : '',
                    startDate: urlParams.get('startDate'),
                    initialAmount: parseFloat(urlParams.get('amount')),
                    annualRate: parseFloat(urlParams.get('rate'))
                };
            } catch (e) {
                console.error('Ошибка при разборе параметров URL:', e);
                return null;
            }
        }

        // Автозапуск счётчика при наличии параметров в URL
        const urlCounterData = getCounterDataFromUrl();
        if (urlCounterData) {
            // Заполняем форму данными из URL
            counterNameInput.value = urlCounterData.name;
            imageUrlInput.value = urlCounterData.imageUrl;
            startDateInput.value = urlCounterData.startDate;
            initialAmountInput.value = urlCounterData.initialAmount;
            annualRateInput.value = urlCounterData.annualRate;

            // Загружаем изображение, если есть
            if (urlCounterData.imageUrl) {
                const img = imagePreview.querySelector('img');
                img.src = urlCounterData.imageUrl;
                img.onload = function() {
                    imagePreview.style.display = 'block';
                };
            }

            // Запускаем счётчик
            switchToCounterPage(urlCounterData);
        }
    });
</script>
</body>
</html>
