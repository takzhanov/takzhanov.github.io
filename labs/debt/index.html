<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Процентный счётчик</title>

    <style>
        :root {
            --bg1: #667eea;
            --bg2: #764ba2;
            --primary: #667eea;
            --primary-dark: #4a5bd4;
            --secondary: #eef2ff;
            --text-main: #1f2933;
            --text-muted: #6b7280;
            --success: #38a169;
            --danger: #e53e3e;
            --radius: 20px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg1), var(--bg2));
            font-family: system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 640px;
            background: #fff;
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.25);
        }

        .hidden { display: none !important; }

        /* ----------- SETTINGS ----------- */

        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-weight: 700;
            color: var(--text-main);
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .field label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input {
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #d5d7df;
            font-size: 1rem;
        }

        .row {
            display: flex;
            gap: 12px;
        }
        .col { flex: 1; }

        .image-btns {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.15s;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover { background: var(--primary-dark); }

        .btn-secondary {
            background: var(--secondary);
            color: var(--primary-dark);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #cbd5f5;
            color: var(--primary-dark);
        }

        /* image preview */
        .preview-wrap {
            display: none;
            justify-content: center;
            margin: 12px 0;
        }

        .preview-wrap.visible {
            display: flex;
        }

        .preview-wrap img {
            max-width: 100%;
            max-height: 260px;
            border-radius: var(--radius);
            object-fit: contain;
        }

        /* ---------- COUNTER ----------- */

        .counter-title {
            margin: 16px 0 12px;
            font-size: clamp(1.4rem, 3.5vw, 2.2rem);
            text-align: center;
            font-weight: 700;
        }

        .counter-img {
            display: none;
            justify-content: center;
            margin-bottom: 12px;
        }
        .counter-img.visible { display: flex; }

        .counter-img img {
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: var(--radius);
        }

        .amount-block {
            margin-top: 8px;
            padding: 16px 12px 20px;
            background: linear-gradient(145deg, #f9fafb, #eef2ff);
            border: 1px solid rgba(120,130,150,0.35);
            border-radius: var(--radius);
            text-align: center;
        }

        .main-amount {
            font-family: "Courier New", monospace;
            font-size: clamp(2.4rem, 6vw, 4rem);
            font-weight: 700;
            user-select: none;
            position: relative;
        }

        /* tooltip */
        .tooltip {
            position: absolute;
            top: -58px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            padding: 6px 10px;
            border-radius: 6px;
            color: #fff;
            white-space: nowrap;
            font-size: 0.8rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s;
        }

        .main-amount:hover .tooltip {
            opacity: 1;
        }

        .info-line {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .btns-row {
            margin-top: 18px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btns-row .btn {
            min-width: 120px;
        }

        /* ---------- Toast --------- */
        .toast-container {
            position: fixed;
            top: 16px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 999;
        }

        .toast {
            padding: 10px 16px;
            border-radius: 10px;
            color: #fff;
            opacity: 0;
            transform: translateX(120%);
            transition: 0.2s;
            max-width: 260px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
        .toast-visible {
            opacity: 1;
            transform: translateX(0);
        }

        @media (max-width: 480px) {
            .container { padding: 18px; }
            .btn { width: 100%; justify-content: center; }
            .btns-row { flex-direction: column; }
        }
    </style>
</head>

<body>

<!-------------------- APP -------------------->
<div class="container">

    <!-- SETTINGS -->
    <section id="settingsView">
        <h1>Процентный счётчик</h1>
        <p class="subtitle">Укажи параметры или просто запусти по умолчанию</p>

        <div class="field">
            <label>Название</label>
            <input id="nameInput" type="text" placeholder="Например: Инвестиции 2030"
                   value="Мой капитал">
        </div>

        <div class="field">
            <label>Ссылка на картинку (необязательно)</label>
            <input id="imageInput" type="url" placeholder="https://example.com/img.png">
            <div class="image-btns">
                <button type="button" id="previewBtn" class="btn btn-secondary">👁‍🗨 Просмотр</button>
                <button type="button" id="clearImgBtn" class="btn btn-outline">🧹 Удалить</button>
            </div>
        </div>

        <div id="previewWrap" class="preview-wrap">
            <img id="previewImg">
        </div>

        <div class="row">
            <div class="col field">
                <label>Дата начала</label>
                <input id="startDateInput" type="datetime-local">
            </div>

            <div class="col field">
                <label>Начальная сумма</label>
                <input id="amountInput" type="number" value="1000000">
            </div>
        </div>

        <div class="field">
            <label>Ставка (% годовых)</label>
            <input id="rateInput" type="text" value="10">
        </div>

        <button id="startBtn" class="btn btn-primary" style="margin-top:10px;">
            🚀 Запустить счётчик
        </button>
    </section>

    <!-- COUNTER -->
    <section id="counterView" class="hidden">

        <div id="counterImgWrap" class="counter-img">
            <img id="counterImg">
        </div>

        <h2 id="counterTitle" class="counter-title"></h2>

        <div class="amount-block">
            <div class="main-amount" id="mainAmount">
                0
                <div class="tooltip" id="growthTooltip"></div>
            </div>
            <div class="info-line" id="elapsedInfo">Прошло: 0д 0ч 0м 0с</div>
            <div class="info-line" id="detailsInfo"></div>
        </div>

        <div class="btns-row">
            <button id="backBtn" class="btn btn-secondary">⚙️ Настройки</button>
            <button id="shareBtn" class="btn btn-outline">🔗 Поделиться</button>
        </div>

    </section>
</div>


<!---------------------- TOASTS ---------------------->
<div class="toast-container" id="toastContainer"></div>

<!---------------------- SCRIPT ---------------------->
<script>
    (function () {
        "use strict";

        const SEC = 1000;
        const YEAR_SEC = 365 * 24 * 3600;

        let state = {
            name: "",
            imageUrl: "",
            startDate: null,
            startDateStr: "",
            amount: 1000000,
            rate: 10
        };

        let timer = null;

        /* DOM */
        const settingsView = document.getElementById("settingsView");
        const counterView = document.getElementById("counterView");

        const nameInput = document.getElementById("nameInput");
        const imageInput = document.getElementById("imageInput");
        const startDateInput = document.getElementById("startDateInput");
        const amountInput = document.getElementById("amountInput");
        const rateInput = document.getElementById("rateInput");

        const previewBtn = document.getElementById("previewBtn");
        const clearImgBtn = document.getElementById("clearImgBtn");

        const previewWrap = document.getElementById("previewWrap");
        const previewImg = document.getElementById("previewImg");

        const startBtn = document.getElementById("startBtn");

        const counterImgWrap = document.getElementById("counterImgWrap");
        const counterImg = document.getElementById("counterImg");
        const counterTitle = document.getElementById("counterTitle");

        const mainAmountEl = document.getElementById("mainAmount");
        const growthTooltip = document.getElementById("growthTooltip");

        const elapsedInfo = document.getElementById("elapsedInfo");
        const detailsInfo = document.getElementById("detailsInfo");

        const backBtn = document.getElementById("backBtn");
        const shareBtn = document.getElementById("shareBtn");

        const toastContainer = document.getElementById("toastContainer");

        /* Utils */

        function toast(text, type) {
            const t = document.createElement("div");
            t.className = "toast " + (type === "error" ? "toast-error" : "toast-success");
            t.textContent = text;
            toastContainer.appendChild(t);

            requestAnimationFrame(() => t.classList.add("toast-visible"));

            setTimeout(() => {
                t.classList.remove("toast-visible");
                setTimeout(() => t.remove(), 200);
            }, 2500);
        }

        function nowLocalStr() {
            const d = new Date();
            const p = (n) => String(n).padStart(2, "0");
            return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
        }

        function parseRate(v) {
            return parseFloat(String(v).replace(",", "."));
        }

        function formatThousands(num) {
            if (!Number.isFinite(num)) return "0";

            const parts = num.toFixed(2);
            if (parts.endsWith(".00")) {
                return Number(num.toFixed(0)).toLocaleString("ru-RU");
            }
            return Number(num.toFixed(2)).toLocaleString("ru-RU");
        }

        function timeParts(sec) {
            sec = Math.max(0, sec);
            const d = Math.floor(sec / 86400);
            sec %= 86400;
            const h = Math.floor(sec / 3600);
            sec %= 3600;
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return {d, h, m, s};
        }

        function loadPreview(url) {
            if (!url) return toast("Введите URL", "error");

            previewImg.src = url;
            previewImg.onload = () => previewWrap.classList.add("visible");
            previewImg.onerror = () => {
                previewWrap.classList.remove("visible");
                previewImg.removeAttribute("src");
                toast("Ошибка загрузки", "error");
            };
        }

        function applyInputs() {
            state.name = nameInput.value.trim() || "Счётчик";
            state.imageUrl = imageInput.value.trim();

            const dateStr = startDateInput.value || nowLocalStr();
            state.startDateStr = dateStr;
            state.startDate = new Date(dateStr);

            state.amount = Number(amountInput.value || 1000000);
            state.rate = parseRate(rateInput.value || "10");
        }

        function buildURL() {
            const p = new URLSearchParams();
            p.set("name", state.name);
            if (state.imageUrl) p.set("image", state.imageUrl);
            p.set("startDate", state.startDateStr);
            p.set("amount", state.amount);
            p.set("rate", state.rate);
            p.set("autoStart", "true");

            return location.origin + location.pathname + "?" + p.toString();
        }

        /* Counter */

        function updateCounter() {
            const now = new Date();
            const elapsedSec = Math.floor((now - state.startDate) / 1000);
            const years = elapsedSec / YEAR_SEC;

            const current = state.amount * Math.pow(1 + state.rate/100, years);

            mainAmountEl.childNodes[0].textContent = formatThousands(current);

            const parts = timeParts(elapsedSec);
            elapsedInfo.textContent = `Прошло: ${parts.d}д ${parts.h}ч ${parts.m}м ${parts.s}с`;

            detailsInfo.textContent =
                `${formatThousands(state.amount)} с ${state.startDateStr.replace("T"," ")} под ${state.rate}%`;

            /* приросты */
            const perSecondRate = state.amount * (Math.pow(1 + state.rate/100, 1 / YEAR_SEC) - 1);
            const perHour = perSecondRate * 3600;
            const perDay = perSecondRate * 86400;

            growthTooltip.textContent = `+${formatThousands(perHour)} в час\n+${formatThousands(perDay)} в день`;
        }

        function startCounter() {
            counterTitle.textContent = "💰 " + state.name;

            if (state.imageUrl) {
                counterImgWrap.classList.add("visible");
                counterImg.src = state.imageUrl;
            } else {
                counterImgWrap.classList.remove("visible");
                counterImg.removeAttribute("src");
            }

            settingsView.classList.add("hidden");
            counterView.classList.remove("hidden");

            updateCounter();
            timer = setInterval(updateCounter, 1000);
        }

        function toSettings() {
            clearInterval(timer);
            counterView.classList.add("hidden");
            settingsView.classList.remove("hidden");
        }

        /* Init from URL */

        function initFromURL() {
            const p = new URLSearchParams(location.search);
            if (!p.has("name")) {
                startDateInput.value = nowLocalStr();
                return;
            }

            if (p.get("name")) nameInput.value = p.get("name");
            if (p.get("image")) {
                imageInput.value = p.get("image");
                loadPreview(p.get("image"));
            }
            if (p.get("startDate")) startDateInput.value = p.get("startDate");
            if (p.get("amount")) amountInput.value = p.get("amount");
            if (p.get("rate")) rateInput.value = p.get("rate");

            if (p.get("autoStart") === "true") {
                applyInputs();
                startCounter();
            }
        }

        /* Listeners */

        previewBtn.onclick = () => loadPreview(imageInput.value.trim());
        clearImgBtn.onclick = () => {
            imageInput.value = "";
            previewWrap.classList.remove("visible");
            previewImg.removeAttribute("src");
        };

        startBtn.onclick = () => {
            applyInputs();
            if (state.amount <= 0) return toast("Некорректная сумма", "error");
            if (!Number.isFinite(state.rate)) return toast("Некорректная ставка", "error");

            const url = buildURL();
            navigator.clipboard.writeText(url).catch(() => 0);
            history.replaceState({}, "", url);
            toast("Ссылка скопирована", "success");

            startCounter();
        };

        backBtn.onclick = () => toSettings();

        shareBtn.onclick = () => {
            navigator.clipboard.writeText(location.href)
                .then(() => toast("Скопировано", "success"))
                .catch(() => toast("Ошибка", "error"));
        };

        /* Start */

        document.addEventListener("DOMContentLoaded", initFromURL);
    })();
</script>

</body>
</html>
